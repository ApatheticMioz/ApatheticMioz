<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e1a"/>
      <stop offset="0.55" stop-color="#11162b"/>
      <stop offset="1" stop-color="#181a38"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.35" stop-color="#bb9af7"/>
      <stop offset="0.7" stop-color="#f7768e"/>
      <stop offset="1" stop-color="#7aa2f7"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ac3de"/>
      <stop offset="1" stop-color="#73daca"/>
    </linearGradient>
    <radialGradient id="orbGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#bb9af7" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#bb9af7" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes drift1 { 0% { transform: translateX(0); } 50% { transform: translateX(-60px); } 100% { transform: translateX(0); } }
      @keyframes drift2 { 0% { transform: translateX(0); } 50% { transform: translateX(70px); } 100% { transform: translateX(0); } }
      @keyframes pulse { 0%, 100% { opacity: 0.6; transform: scale(1); } 50% { opacity: 1; transform: scale(1.06); } }
      @keyframes glowline { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.9; } }
      .w1 { animation: drift1 10s ease-in-out infinite; }
      .w2 { animation: drift2 14s ease-in-out infinite; }
      .orb { animation: pulse 4s ease-in-out infinite; transform-origin: 790px 78px; }
      .line { animation: glowline 4.5s ease-in-out infinite; }
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="250" fill="url(#bg)"/>

  <!-- Subtle Architecture Grid -->
  <g stroke="#7aa2f7" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="50" x2="900" y2="50"/>
    <line x1="0" y1="100" x2="900" y2="100"/>
    <line x1="0" y1="150" x2="900" y2="150"/>
    <line x1="150" y1="0" x2="150" y2="250"/>
    <line x1="300" y1="0" x2="300" y2="250"/>
    <line x1="450" y1="0" x2="450" y2="250"/>
    <line x1="600" y1="0" x2="600" y2="250"/>
    <line x1="750" y1="0" x2="750" y2="250"/>
  </g>

  <!-- Animated Stream Waves -->
  <g class="w1">
    <path d="M-80,185 C140,150 340,215 560,185 C740,160 860,190 980,175 L980,250 L-80,250 Z"
          fill="url(#wave)" opacity="0.15"/>
  </g>
  <g class="w2">
    <path d="M-80,205 C200,175 420,230 640,202 C780,185 900,210 980,198 L980,250 L-80,250 Z"
          fill="url(#wave2)" opacity="0.12"/>
  </g>
  <line class="line" x1="0" y1="185" x2="900" y2="185" stroke="url(#wave)" stroke-width="1.5" opacity="0.4"/>

  <!-- High-Performance Systems Node -->
  <circle class="orb" cx="790" cy="78" r="46" fill="url(#orbGlow)"/>
  <circle cx="790" cy="78" r="18" fill="#181a38" stroke="#bb9af7" stroke-width="2.5" filter="url(#glow)"/>
  <g fill="#7aa2f7" font-size="11" font-weight="700" text-anchor="middle">
    <text x="790" y="82">SYS</text>
  </g>
  <g stroke="#bb9af7" stroke-width="2" stroke-linecap="round">
    <line x1="773" y1="61" x2="768" y2="54"/>
    <line x1="790" y1="58" x2="790" y2="50"/>
    <line x1="807" y1="61" x2="812" y2="54"/>
    <line x1="773" y1="95" x2="768" y2="102"/>
    <line x1="790" y1="98" x2="790" y2="106"/>
    <line x1="807" y1="95" x2="812" y2="102"/>
  </g>

  <!-- Identity Block -->
  <text x="60" y="88" font-size="36" font-weight="800" fill="#c0caf5" letter-spacing="-0.5">ApatheticMioz</text>
  <text x="60" y="116" font-size="15" font-weight="600" fill="#7aa2f7">Applied AI &amp; High-Performance Systems Engineer</text>
  <text x="60" y="146" font-size="14.5" fill="#a9b1d6">Local LLM Serving Infrastructure · Geo-Distributed RAG · Autonomous Systems</text>

  <!-- Verified Tech Stack Badges -->
  <g font-size="12" font-weight="600">
    <!-- Rust 2024 -->
    <g>
      <rect x="60" y="174" width="86" height="26" rx="13" fill="#dea584" fill-opacity="0.15" stroke="#dea584" stroke-width="1.2"/>
      <text x="103" y="191.5" fill="#dea584" text-anchor="middle">Rust 2024</text>
    </g>
    <!-- Python -->
    <g>
      <rect x="154" y="174" width="74" height="26" rx="13" fill="#3572a5" fill-opacity="0.15" stroke="#7aa2f7" stroke-width="1.2"/>
      <text x="191" y="191.5" fill="#7aa2f7" text-anchor="middle">Python</text>
    </g>
    <!-- vLLM -->
    <g>
      <rect x="236" y="174" width="68" height="26" rx="13" fill="#bb9af7" fill-opacity="0.15" stroke="#bb9af7" stroke-width="1.2"/>
      <text x="270" y="191.5" fill="#bb9af7" text-anchor="middle">vLLM</text>
    </g>
    <!-- PyTorch -->
    <g>
      <rect x="312" y="174" width="80" height="26" rx="13" fill="#f7768e" fill-opacity="0.15" stroke="#f7768e" stroke-width="1.2"/>
      <text x="352" y="191.5" fill="#f7768e" text-anchor="middle">PyTorch</text>
    </g>
    <!-- C++ -->
    <g>
      <rect x="400" y="174" width="64" height="26" rx="13" fill="#f34b7d" fill-opacity="0.15" stroke="#f34b7d" stroke-width="1.2"/>
      <text x="432" y="191.5" fill="#f34b7d" text-anchor="middle">C++20</text>
    </g>
    <!-- Next.js / React -->
    <g>
      <rect x="472" y="174" width="92" height="26" rx="13" fill="#2ac3de" fill-opacity="0.15" stroke="#2ac3de" stroke-width="1.2"/>
      <text x="518" y="191.5" fill="#2ac3de" text-anchor="middle">Next.js 16</text>
    </g>
    <!-- Qdrant -->
    <g>
      <rect x="572" y="174" width="78" height="26" rx="13" fill="#e0af68" fill-opacity="0.15" stroke="#e0af68" stroke-width="1.2"/>
      <text x="611" y="191.5" fill="#e0af68" text-anchor="middle">Qdrant</text>
    </g>
    <!-- WireGuard -->
    <g>
      <rect x="658" y="174" width="92" height="26" rx="13" fill="#9ece6a" fill-opacity="0.15" stroke="#9ece6a" stroke-width="1.2"/>
      <text x="704" y="191.5" fill="#9ece6a" text-anchor="middle">WireGuard</text>
    </g>
  </g>
</svg>
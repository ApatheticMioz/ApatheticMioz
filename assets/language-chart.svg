<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 300" width="520" height="300">
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .bar { transition: opacity .3s; }
    </style>
  </defs>

  <!-- Card -->
  <rect width="520" height="300" fill="#0d1121"/>
  <rect x="0" y="0" width="520" height="4" fill="url(#topline)"/>
  <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#7aa2f7"/>
    <stop offset="1" stop-color="#bb9af7"/>
  </linearGradient>

  <text x="24" y="34" font-size="16" font-weight="700" fill="#c0caf5">Languages</text>
  <text x="24" y="52" font-size="11" fill="#565f89">Byte-share across 30 public repositories · Aug 2026</text>

  <!-- Python 40.9% -->
  <text x="24" y="92" font-size="13" fill="#9aa5ce">Python</text>
  <rect x="130" y="80" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="80" width="330" height="13" rx="6.5" fill="#3572a5" class="bar"/>
  <text x="470" y="92" font-size="12" fill="#c0caf5" text-anchor="end">40.9%</text>

  <!-- C++ 29.4% -->
  <text x="24" y="122" font-size="13" fill="#9aa5ce">C++</text>
  <rect x="130" y="110" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="110" width="237" height="13" rx="6.5" fill="#f34b7d" class="bar"/>
  <text x="470" y="122" font-size="12" fill="#c0caf5" text-anchor="end">29.4%</text>

  <!-- Jupyter 15.1% -->
  <text x="24" y="152" font-size="13" fill="#9aa5ce">Jupyter</text>
  <rect x="130" y="140" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="140" width="122" height="13" rx="6.5" fill="#da5b0b" class="bar"/>
  <text x="470" y="152" font-size="12" fill="#c0caf5" text-anchor="end">15.1%</text>

  <!-- Starlark 2.3% -->
  <text x="24" y="182" font-size="13" fill="#9aa5ce">Starlark</text>
  <rect x="130" y="170" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="170" width="19" height="13" rx="6.5" fill="#77aa99" class="bar"/>
  <text x="470" y="182" font-size="12" fill="#c0caf5" text-anchor="end">2.3%</text>

  <!-- Objective-C++ 2.2% -->
  <text x="24" y="212" font-size="13" fill="#9aa5ce">Obj-C++</text>
  <rect x="130" y="200" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="200" width="18" height="13" rx="6.5" fill="#65a842" class="bar"/>
  <text x="470" y="212" font-size="12" fill="#c0caf5" text-anchor="end">2.2%</text>

  <!-- Shell 1.3% -->
  <text x="24" y="242" font-size="13" fill="#9aa5ce">Shell</text>
  <rect x="130" y="230" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="230" width="11" height="13" rx="5.5" fill="#89a0fb" class="bar"/>
  <text x="470" y="242" font-size="12" fill="#c0caf5" text-anchor="end">1.3%</text>

  <!-- Other 8.8% -->
  <text x="24" y="272" font-size="13" fill="#9aa5ce">Other</text>
  <rect x="130" y="260" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="260" width="72" height="13" rx="6.5" fill="#565f89" class="bar"/>
  <text x="470" y="272" font-size="12" fill="#c0caf5" text-anchor="end">8.8%</text>
</svg>

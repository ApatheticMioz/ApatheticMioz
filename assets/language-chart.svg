<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 340" width="520" height="340">
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .bar { transition: opacity .3s; }
    </style>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="520" height="340" rx="8" fill="#0d1121"/>
  <rect x="0" y="0" width="520" height="4" rx="2" fill="url(#topline)"/>

  <text x="24" y="34" font-size="16" font-weight="700" fill="#c0caf5">Verified Language Distribution (Source Code)</text>
  <text x="24" y="52" font-size="11" fill="#565f89">Measured across 6.7 MB public repository source code &#183; 2026</text>

  <!-- Python 50.6% -->
  <text x="24" y="88" font-size="13" font-weight="600" fill="#9aa5ce">Python</text>
  <rect x="130" y="76" width="320" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="76" width="162" height="13" rx="6.5" fill="#3572a5" class="bar"/>
  <text x="470" y="88" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">50.6%</text>

  <!-- Rust 19.3% -->
  <text x="24" y="118" font-size="13" font-weight="600" fill="#9aa5ce">Rust</text>
  <rect x="130" y="106" width="320" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="106" width="62" height="13" rx="6.5" fill="#dea584" class="bar"/>
  <text x="470" y="118" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">19.3%</text>

  <!-- C++ 13.8% -->
  <text x="24" y="148" font-size="13" font-weight="600" fill="#9aa5ce">C++</text>
  <rect x="130" y="136" width="320" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="136" width="44" height="13" rx="6.5" fill="#f34b7d" class="bar"/>
  <text x="470" y="148" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">13.8%</text>

  <!-- JavaScript 5.6% -->
  <text x="24" y="178" font-size="13" font-weight="600" fill="#9aa5ce">JavaScript</text>
  <rect x="130" y="166" width="320" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="166" width="18" height="13" rx="6.5" fill="#f1e05a" class="bar"/>
  <text x="470" y="178" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">5.6%</text>

  <!-- R 3.3% -->
  <text x="24" y="208" font-size="13" font-weight="600" fill="#9aa5ce">R</text>
  <rect x="130" y="196" width="320" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="196" width="11" height="13" rx="5.5" fill="#198ce7" class="bar"/>
  <text x="470" y="208" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">3.3%</text>

  <!-- Shell 2.8% -->
  <text x="24" y="238" font-size="13" font-weight="600" fill="#9aa5ce">Shell</text>
  <rect x="130" y="226" width="320" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="226" width="9" height="13" rx="4.5" fill="#89a0fb" class="bar"/>
  <text x="470" y="238" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">2.8%</text>

  <!-- Assembly 1.9% -->
  <text x="24" y="268" font-size="13" font-weight="600" fill="#9aa5ce">Assembly</text>
  <rect x="130" y="256" width="320" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="256" width="6" height="13" rx="3" fill="#6e4c13" class="bar"/>
  <text x="470" y="268" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">1.9%</text>

  <!-- Other 2.7% -->
  <text x="24" y="298" font-size="13" font-weight="600" fill="#9aa5ce">Other</text>
  <rect x="130" y="286" width="320" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="286" width="9" height="13" rx="4.5" fill="#565f89" class="bar"/>
  <text x="470" y="298" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">2.7%</text>
</svg>

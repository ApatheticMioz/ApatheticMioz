<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 320" width="520" height="320">
  <defs>
    <style>
      text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .bar { transition: opacity .3s; }
    </style>
    <linearGradient id="topline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="1" stop-color="#bb9af7"/>
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect width="520" height="320" rx="8" fill="#0d1121"/>
  <rect x="0" y="0" width="520" height="4" rx="2" fill="url(#topline)"/>

  <text x="24" y="34" font-size="16" font-weight="700" fill="#c0caf5">Verified Language Byte-Share</text>
  <text x="24" y="52" font-size="11" fill="#565f89">Measured across 53.2 MB public repository source &#183; 2026</text>

  <!-- Python 31.3% (width = 330 * 0.313 = 103) -->
  <text x="24" y="92" font-size="13" font-weight="600" fill="#9aa5ce">Python</text>
  <rect x="130" y="80" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="80" width="103" height="13" rx="6.5" fill="#3572a5" class="bar"/>
  <text x="470" y="92" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">31.3%</text>

  <!-- C++ 20.2% (width = 330 * 0.202 = 67) -->
  <text x="24" y="122" font-size="13" font-weight="600" fill="#9aa5ce">C++</text>
  <rect x="130" y="110" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="110" width="67" height="13" rx="6.5" fill="#f34b7d" class="bar"/>
  <text x="470" y="122" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">20.2%</text>

  <!-- Jupyter 19.6% (width = 330 * 0.196 = 65) -->
  <text x="24" y="152" font-size="13" font-weight="600" fill="#9aa5ce">Jupyter</text>
  <rect x="130" y="140" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="140" width="65" height="13" rx="6.5" fill="#da5b0b" class="bar"/>
  <text x="470" y="152" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">19.6%</text>

  <!-- HTML / Visual 15.1% (width = 330 * 0.151 = 50) -->
  <text x="24" y="182" font-size="13" font-weight="600" fill="#9aa5ce">HTML / SVG</text>
  <rect x="130" y="170" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="170" width="50" height="13" rx="6.5" fill="#e34c26" class="bar"/>
  <text x="470" y="182" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">15.1%</text>

  <!-- Rust 2024 2.4% (width = 330 * 0.05 min bar visibility = 18) -->
  <text x="24" y="212" font-size="13" font-weight="600" fill="#dea584">Rust 2024</text>
  <rect x="130" y="200" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="200" width="18" height="13" rx="6.5" fill="#dea584" class="bar"/>
  <text x="470" y="212" font-size="12" font-weight="600" fill="#dea584" text-anchor="end">2.4% (1.3 MB)</text>

  <!-- Shell 1.2% (width = 12) -->
  <text x="24" y="242" font-size="13" font-weight="600" fill="#9aa5ce">Shell / Bash</text>
  <rect x="130" y="230" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="230" width="12" height="13" rx="6" fill="#89a0fb" class="bar"/>
  <text x="470" y="242" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">1.2%</text>

  <!-- Other (TeX, JS, Starlark, MASM, SQL) 10.2% (width = 34) -->
  <text x="24" y="272" font-size="13" font-weight="600" fill="#9aa5ce">Other</text>
  <rect x="130" y="260" width="330" height="13" rx="6.5" fill="#1f2440"/>
  <rect x="130" y="260" width="34" height="13" rx="6.5" fill="#565f89" class="bar"/>
  <text x="470" y="272" font-size="12" font-weight="600" fill="#c0caf5" text-anchor="end">10.2%</text>
</svg>
